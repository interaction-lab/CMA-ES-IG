<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simplified Blossom robot: knit-gray head and bell-shaped body with floppy dark ears.
       The ears get a gray outline, and turn light in dark mode, so they stay visible on dark tab bars. -->
  <style>@media (prefers-color-scheme: dark) { .ear { fill: #c4c7cd; } }</style>
  <g fill="#7b7f87">
    <path d="M12.6 17.5 C12.4 22.2 7.6 24 6.8 28 L25.2 28 C24.4 24 19.6 22.2 19.4 17.5 Z"/>
    <ellipse cx="16" cy="11.8" rx="8.4" ry="7.4"/>
    <rect x="5.4" y="26.8" width="21.2" height="3.6" rx="1.8"/>
  </g>
  <!-- floppy ears: attached at the top of the head, hanging down past the cheeks -->
  <g class="ear" fill="#1d1f23" stroke="#7b7f87" stroke-width="0.9" stroke-linejoin="round">
    <path id="ear" d="M12.4 5.4 C7.6 4.6 3.4 8.2 3.1 14.2 C2.9 18.6 4.2 21.6 6.4 21.7 C8.4 21.8 9.1 19.2 9.3 16 C9.5 12.4 10.4 8.6 13 6.6 Z"/>
    <use href="#ear" transform="translate(32 0) scale(-1 1)"/>
  </g>
  <g fill="#1d1f23">
    <circle cx="13.1" cy="11.8" r="1.3"/>
    <circle cx="18.9" cy="11.8" r="1.3"/>
    <path d="M14.9 14.3 H17.1 Q17.3 14.3 17.15 14.55 L16.25 15.6 Q16 15.9 15.75 15.6 L14.85 14.55 Q14.7 14.3 14.9 14.3 Z"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Simplified Blossom robot: paddle-shaped dark ears (narrow where they attach, broad rounded tips,
       angled outward), knit-gray head and bell-shaped body. The ears get a gray outline, and turn
       light in dark mode, so they stay visible on dark tab bars. -->
  <style>@media (prefers-color-scheme: dark) { .ear { fill: #c4c7cd; } }</style>
  <defs>
    <path id="ear" d="M0 0 C-1 -1.7 -2.8 -4.2 -2.8 -6.4 C-2.8 -8.4 -1.5 -9.5 0 -9.5 C1.5 -9.5 2.8 -8.4 2.8 -6.4 C2.8 -4.2 1 -1.7 0 0 Z"/>
  </defs>
  <g class="ear" fill="#1d1f23" stroke="#7b7f87" stroke-width="0.9" stroke-linejoin="round">
    <use href="#ear" transform="translate(11.4 10.4) rotate(-25)"/>
    <use href="#ear" transform="translate(20.6 10.4) rotate(25)"/>
  </g>
  <g fill="#7b7f87">
    <path d="M12.6 19 C12.4 22.8 7.6 24.4 6.8 28 L25.2 28 C24.4 24.4 19.6 22.8 19.4 19 Z"/>
    <ellipse cx="16" cy="14.6" rx="8.4" ry="6.6"/>
    <rect x="5.4" y="26.8" width="21.2" height="3.6" rx="1.8"/>
  </g>
  <g fill="#1d1f23">
    <circle cx="12.9" cy="14.8" r="1.3"/>
    <circle cx="19.1" cy="14.8" r="1.3"/>
    <path d="M14.9 17.1 H17.1 Q17.3 17.1 17.15 17.35 L16.25 18.4 Q16 18.7 15.75 18.4 L14.85 17.35 Q14.7 17.1 14.9 17.1 Z"/>
  </g>
</svg>
